name: Fetch set data

on:
  workflow_dispatch:
    inputs:
      set:
        description: Set code (lowercase), runs fetch-<set>-data.py
        required: true
        default: fra
  push:
    paths:
      - .github/workflows/fetch-set-data.yml
      - fetch-fra-data.py

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SET: ${{ inputs.set || 'fra' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python fetch-${SET}-data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/data/${SET}-data.json
          git diff --cached --quiet || git commit -m "update ${SET} data"
          git push
